<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b83b31" />
    <meta name="robots" content="noindex,nofollow" />
    <title>成绩管理｜英语红宝书</title>
    <link rel="stylesheet" href="assets/styles.css?v=20261015-6" />
  </head>
  <body>
    <div class="page-shell admin-shell">
      <header class="site-header">
        <a class="brand" href="index.html">
          <span class="brand-mark">英</span>
          <span><strong>英语红宝书</strong><small>成绩管理</small></span>
        </a>
        <a class="text-link" href="index.html">返回考试页</a>
      </header>

      <main class="admin-main">
        <section class="admin-login" id="adminLogin">
          <span class="eyebrow">ADMIN ACCESS</span>
          <h1>成绩管理</h1>
          <p id="loginDescription">仅限管理员登录。登录后可以查看所有老师的考试成绩。</p>
          <form id="loginForm" class="login-form hidden">
            <label>管理员邮箱<input type="email" id="adminEmail" autocomplete="username" required /></label>
            <label>密码<input type="password" id="adminPassword" autocomplete="current-password" required /></label>
            <button class="primary-button" type="submit">登录查看成绩</button>
            <p class="error-message" id="loginError" role="alert"></p>
          </form>
          <div class="setup-notice hidden" id="setupNotice"></div>
          <div class="admin-help">
            <strong>怎么查看每位老师的成绩？</strong>
            <ol>
              <li>老师在考试页输入姓名、完成20题并提交。</li>
              <li>管理员使用唯一的邮箱和密码登录此页面。</li>
              <li>可按老师姓名、日期、合格状态筛选，也可以导出Excel可打开的CSV表格。</li>
            </ol>
            <p>老师前台不会显示后台入口；管理员通过单独的后台网址进入。</p>
          </div>
        </section>

        <section class="admin-dashboard hidden" id="adminDashboard">
          <div class="dashboard-heading">
            <div><span class="eyebrow">SCOREBOARD</span><h1>考试成绩总览</h1></div>
            <div class="dashboard-actions">
              <button class="secondary-button" id="exportButton" type="button">导出CSV</button>
              <button class="text-button" id="logoutButton" type="button">退出</button>
            </div>
          </div>

          <div class="mode-banner" id="modeBanner"></div>

          <div class="summary-grid">
            <div class="summary-card"><span>参考人次</span><strong id="totalAttempts">0</strong></div>
            <div class="summary-card"><span>平均分</span><strong id="averageScore">0</strong></div>
            <div class="summary-card"><span>合格率</span><strong id="passRate">0%</strong></div>
            <div class="summary-card"><span>今日参考</span><strong id="todayAttempts">0</strong></div>
          </div>

          <div class="filter-bar">
            <label>搜索老师<input id="nameFilter" type="search" placeholder="输入姓名" /></label>
            <label>考试日期<input id="dateFilter" type="date" /></label>
            <label>考试结果
              <select id="statusFilter">
                <option value="">全部</option>
                <option value="passed">合格</option>
                <option value="failed">不合格</option>
              </select>
            </label>
            <button class="text-button" id="clearFilters" type="button">清除筛选</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead><tr><th>老师</th><th>日期</th><th>成绩</th><th>答对</th><th>结果</th><th>用时</th><th>提交时间</th></tr></thead>
              <tbody id="resultTable"></tbody>
            </table>
            <div class="empty-state hidden" id="emptyState">暂时没有符合条件的成绩记录</div>
          </div>
        </section>
      </main>
    </div>

    <script src="config.js?v=20261015"></script>
    <script src="assets/storage.js?v=20261015"></script>
    <script src="assets/admin.js?v=20261015"></script>
  </body>
</html>
